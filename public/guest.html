<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Your Seat</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Jost:wght@300;400;500&display=swap');

  :root {
    --cream: #faf7f2;
    --parchment: #f0ead8;
    --gold: #c9a84c;
    --gold-light: #e8d49a;
    --dark: #2a2118;
    --mid: #6b5c45;
    --border: #d8cdb8;
    --green: #3d6b50;
    --red: #8b3a3a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: 'Jost', sans-serif;
    background: var(--cream);
    color: var(--dark);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    position: relative;
    overflow-x: hidden;
  }

  .bg-deco { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .petal { position: absolute; font-size: 14px; opacity: 0.12; animation: drift linear infinite; }
  @keyframes drift { 0% { transform: translateY(-20px) rotate(0deg); opacity: 0; } 10% { opacity: 0.15; } 90% { opacity: 0.1; } 100% { transform: translateY(110vh) rotate(360deg); opacity: 0; } }

  body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold), transparent); z-index: 10; }

  .page { width: 100%; max-width: 520px; padding: 60px 24px 40px; position: relative; z-index: 1; }

  .host-banner { display: none; text-align: center; margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid var(--border); animation: fadeDown 0.8s ease both; }
  .host-banner.visible { display: block; }
  .host-logo { max-height: 96px; max-width: 220px; object-fit: contain; margin-bottom: 14px; }
  .host-names { font-family: 'Cormorant Garamond', serif; font-size: clamp(26px, 7vw, 38px); font-weight: 300; line-height: 1.2; color: var(--dark); letter-spacing: 1px; }
  .host-tagline { font-family: 'Cormorant Garamond', serif; font-size: 14px; font-style: italic; color: var(--mid); margin-top: 8px; letter-spacing: 1px; }

  .ornament { text-align: center; margin-bottom: 8px; font-size: 20px; color: var(--gold); letter-spacing: 6px; animation: fadeDown 0.8s ease both; }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }

  header { text-align: center; margin-bottom: 48px; animation: fadeDown 0.9s ease both; }
  .wedding-label { font-size: 10px; letter-spacing: 5px; text-transform: uppercase; color: var(--gold); margin-bottom: 14px; font-weight: 500; }
  h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(42px, 10vw, 64px); font-weight: 300; line-height: 1.05; }
  h1 em { font-style: italic; color: var(--mid); display: block; }
  .tagline { font-family: 'Cormorant Garamond', serif; font-size: 15px; font-style: italic; color: var(--mid); margin-top: 14px; }

  .search-card { background: #fff; border: 1px solid var(--border); padding: 40px 36px; position: relative; animation: fadeUp 0.8s 0.2s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .search-card::before { content: ''; position: absolute; top: 5px; left: 5px; right: 5px; bottom: 5px; border: 1px solid var(--border); pointer-events: none; opacity: 0.35; }

  .search-prompt { text-align: center; margin-bottom: 28px; }
  .search-prompt p { font-family: 'Cormorant Garamond', serif; font-size: 18px; color: var(--mid); font-style: italic; }

  .input-wrap { position: relative; margin-bottom: 16px; }
  .input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--gold); font-size: 16px; pointer-events: none; }

  input[type="text"] { width: 100%; padding: 14px 14px 14px 42px; border: 1px solid var(--border); background: var(--cream); font-family: 'Cormorant Garamond', serif; font-size: 20px; color: var(--dark); outline: none; transition: all 0.2s; border-radius: 1px; }
  input[type="text"]::placeholder { color: var(--border); font-style: italic; }
  input[type="text"]:focus { border-color: var(--gold); background: #fff; box-shadow: 0 0 0 3px rgba(201,168,76,0.1); }

  .suggestions { position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid var(--border); border-top: none; max-height: 220px; overflow-y: auto; z-index: 20; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
  .suggestion-item { padding: 12px 16px; cursor: pointer; font-family: 'Cormorant Garamond', serif; font-size: 17px; border-bottom: 1px solid var(--parchment); display: flex; justify-content: space-between; align-items: center; transition: background 0.15s; }
  .suggestion-item:hover { background: var(--parchment); }
  .suggestion-item:last-child { border-bottom: none; }
  .suggestion-table { font-size: 12px; color: var(--mid); letter-spacing: 1px; font-family: 'Jost', sans-serif; font-style: normal; }

  .search-btn { width: 100%; padding: 14px; background: var(--dark); color: #fff; border: none; font-family: 'Jost', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 3px; text-transform: uppercase; cursor: pointer; transition: all 0.2s; border-radius: 1px; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .search-btn:hover { background: var(--mid); }
  .search-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .result { margin-top: 28px; animation: resultReveal 0.5s ease both; display: none; }
  @keyframes resultReveal { from { opacity: 0; transform: translateY(12px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

  .result.found { background: linear-gradient(135deg, #f8f4e8, #fdf9f0); border: 1px solid var(--gold-light); padding: 32px; text-align: center; position: relative; overflow: hidden; }
  .result.found::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }

  .result-greeting { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; font-weight: 500; }
  .result-name { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 400; color: var(--dark); margin-bottom: 20px; }
  .result-connector { font-family: 'Cormorant Garamond', serif; font-size: 14px; font-style: italic; color: var(--mid); margin-bottom: 16px; }

  .table-reveal { display: inline-block; margin: 8px 0 16px; }
  .table-number { font-family: 'Cormorant Garamond', serif; font-size: 96px; font-weight: 300; line-height: 0.85; color: var(--dark); display: block; animation: popIn 0.4s 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275) both; }
  @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .table-word { font-size: 11px; letter-spacing: 5px; text-transform: uppercase; color: var(--mid); display: block; margin-top: 8px; }
  .result-tagline { font-family: 'Cormorant Garamond', serif; font-size: 14px; font-style: italic; color: var(--mid); margin-top: 12px; }

  .result.not-found { background: #fff8f8; border: 1px solid #e8c5c5; padding: 28px; text-align: center; }
  .not-found-icon { font-size: 28px; margin-bottom: 12px; }
  .not-found-text { font-family: 'Cormorant Garamond', serif; font-size: 18px; color: var(--red); font-style: italic; margin-bottom: 8px; }
  .not-found-sub { font-size: 13px; color: var(--mid); }

  .page-footer { text-align: center; margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--border); color: var(--border); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; animation: fadeUp 1s 0.4s ease both; }

  .table-reveal:hover .table-number { background: linear-gradient(135deg, var(--dark) 30%, var(--gold) 50%, var(--dark) 70%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shimmer 1.5s linear infinite; }
  @keyframes shimmer { 0% { background-position: 200% center; } 100% { background-position: 0% center; } }
</style>
</head>
<body>

<div class="bg-deco" id="bgDeco"></div>

<div class="page">
  <div class="host-banner" id="hostBanner"></div>

  <div class="ornament">✦ &nbsp; ✦ &nbsp; ✦</div>

  <header>
    <div class="wedding-label">You are warmly invited</div>
    <h1>Find Your<em>Seat</em></h1>
    <div class="tagline">Search your name to discover your table</div>
  </header>

  <div class="search-card">
    <div class="search-prompt">
      <p>Enter your name below to find your table</p>
    </div>

    <div class="input-wrap" id="inputWrap">
      <span class="input-icon">✦</span>
      <input type="text" id="nameInput" placeholder="Your full name…"
             autocomplete="off" oninput="onType()" onkeydown="onKey(event)">
      <div class="suggestions" id="suggestions" style="display:none"></div>
    </div>

    <button class="search-btn" id="searchBtn" onclick="search()">
      Find My Seat
    </button>

    <div class="result" id="result"></div>
  </div>

  <div class="page-footer" id="pageFooter">Loading…</div>
</div>

<script>
  const API = '';
  let searchTimeout = null;

  // ── Autocomplete ──────────────────────────────────────────────
  async function onType() {
    const q = document.getElementById('nameInput').value.trim();
    clearTimeout(searchTimeout);
    if (q.length < 2) { hideSuggestions(); return; }

    searchTimeout = setTimeout(async () => {
      try {
        const r = await fetch(`${API}/api/guests/search?q=${encodeURIComponent(q)}`);
        const d = await r.json();
        const guests = d.guests || [];
        const box = document.getElementById('suggestions');

        if (!guests.length) { hideSuggestions(); return; }

        box.innerHTML = guests.map(g => `
          <div class="suggestion-item" onclick="selectGuest('${g.name.replace(/'/g, "\\'")}')">
            <span>${g.name}</span>
            <span class="suggestion-table">Table ${g.table_number}</span>
          </div>
        `).join('');
        box.style.display = 'block';
      } catch { hideSuggestions(); }
    }, 200);
  }

  function onKey(e) {
    if (e.key === 'Enter') { search(); hideSuggestions(); }
    if (e.key === 'Escape') hideSuggestions();
  }

  function hideSuggestions() {
    const box = document.getElementById('suggestions');
    if (box) box.style.display = 'none';
  }

  function selectGuest(name) {
    document.getElementById('nameInput').value = name;
    hideSuggestions();
    search();
  }

  // ── Search ────────────────────────────────────────────────────
  async function search() {
    const q = document.getElementById('nameInput').value.trim();
    if (!q) return;

    const btn = document.getElementById('searchBtn');
    btn.innerHTML = '<span class="spinner"></span>';
    btn.disabled = true;

    const result = document.getElementById('result');
    result.style.display = 'none';

    try {
      const r = await fetch(`${API}/api/guests/lookup?name=${encodeURIComponent(q)}`);
      const d = await r.json();

      void result.offsetWidth; // reflow for animation
      result.className = 'result';

      if (d.found && d.guest) {
        const firstName = d.guest.name.split(' ')[0];
        result.className = 'result found';
        result.innerHTML = `
          <div class="result-greeting">Welcome!</div>
          <div class="result-name">${d.guest.name}</div>
          <div class="result-connector">You are seated at</div>
          <div class="table-reveal">
            <span class="table-number">${d.guest.table_number}</span>
            <span class="table-word">Table</span>
          </div>
          <div class="result-tagline">Enjoy the Simcha!</div>
        `;
      } else {
        result.className = 'result not-found';
        result.innerHTML = `
          <div class="not-found-icon">✦</div>
          <div class="not-found-text">No guest found for "${q}"</div>
          <div class="not-found-sub">Please check your spelling or ask a coordinator for assistance.</div>
        `;
      }

      result.style.display = 'block';
    } catch {
      result.className = 'result not-found';
      result.innerHTML = `
        <div class="not-found-icon">⚠</div>
        <div class="not-found-text">Could not reach the server</div>
        <div class="not-found-sub">Please ask a coordinator for assistance.</div>
      `;
      result.style.display = 'block';
    } finally {
      btn.innerHTML = 'Find My Seat';
      btn.disabled = false;
    }
  }

  // ── Footer stats ──────────────────────────────────────────────
  async function loadFooter() {
    try {
      const r = await fetch(`${API}/api/stats`);
      const d = await r.json();
      document.getElementById('pageFooter').textContent =
        `${d.total_guests} guests · ${d.total_tables} tables`;
    } catch {
      document.getElementById('pageFooter').textContent = '';
    }
  }

  // ── Host banner ───────────────────────────────────────────────
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => (
      { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
    ));
  }

  async function loadBanner() {
    try {
      const r = await fetch(`${API}/api/settings`);
      const d = await r.json();
      const s = d.settings || {};
      if (s.show_banner === false) return;

      const names = (s.host_names || '').trim();
      const line  = (s.tagline || '').trim();
      const logo  = (s.logo_data || '').trim();
      if (!names && !line && !logo) return;

      const el = document.getElementById('hostBanner');
      el.innerHTML = `
        ${logo ? `<img class="host-logo" src="${escapeHtml(logo)}" alt="">` : ''}
        ${names ? `<div class="host-names">${escapeHtml(names)}</div>` : ''}
        ${line ? `<div class="host-tagline">${escapeHtml(line)}</div>` : ''}
      `;
      el.classList.add('visible');
      if (names) document.title = `${names} — Find Your Seat`;
    } catch {}
  }

  // ── Petals ────────────────────────────────────────────────────
  function createPetals() {
    const deco = document.getElementById('bgDeco');
    const symbols = ['✦','❋','✿','❀','✾','✽'];
    for (let i = 0; i < 12; i++) {
      const p = document.createElement('div');
      p.className = 'petal';
      p.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      p.style.left = Math.random() * 100 + 'vw';
      p.style.animationDuration = (12 + Math.random() * 18) + 's';
      p.style.animationDelay = (-Math.random() * 20) + 's';
      p.style.fontSize = (10 + Math.random() * 12) + 'px';
      deco.appendChild(p);
    }
  }

  // Close suggestions on outside click
  document.addEventListener('click', e => {
    if (!document.getElementById('inputWrap')?.contains(e.target)) hideSuggestions();
  });

  createPetals();
  loadBanner();
  loadFooter();
</script>
</body>
</html>
